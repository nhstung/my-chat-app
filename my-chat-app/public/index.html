<!DOCTYPE html>
<html>
<head>
  <title>Simple Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    ul { list-style-type: none; padding: 0; }
    li { margin-bottom: 10px; }
    input { padding: 10px; width: 70%; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <h2>Chat App</h2>
  <ul id="messages"></ul>
  <input id="m" autocomplete="off" placeholder="Type a message" />
  <button onclick="sendMessage()">Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
  const messages = document.getElementById('messages');
  const input = document.getElementById('m');

  // Nạp 2 âm thanh
  const audioSend = new Audio('/send.mp3');
  const audioReceive = new Audio('/ping.mp3');

  function sendMessage() {
    const msg = input.value.trim();
    if (msg) {
    socket.emit('chat message', { text: msg, self: true });
    audioSend.play();  // phát âm thanh gửi
    input.value = '';
  }
}

  // Bấm ENTER để gửi
  input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  });

  socket.on('chat message', function(msg) {
    const item = document.createElement('li');
    item.textContent = msg;
    messages.appendChild(item);
    audioReceive.play();   // <-- Phát tiếng khi nhận
  });
</script>
