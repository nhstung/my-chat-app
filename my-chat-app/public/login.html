<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #messages { list-style-type: none; padding: 0; }
    #messages li { padding: 5px 10px; }
  </style>
</head>
<body>
  <h2>Chat App</h2>
  <ul id="messages"></ul>
  <input id="m" autocomplete="off" placeholder="Type a message" />
  <button onclick="sendMessage()">Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messages = document.getElementById('messages');
    const input = document.getElementById('m');

    // Nạp 2 âm thanh
    const audioSend = new Audio('/send.mp3');
    const audioReceive = new Audio('/ping.mp3');

    function sendMessage() {
      const msg = input.value.trim();
      if (msg) {
        socket.emit('chat message', { text: msg, self: true });
        audioSend.play(); // phát tiếng khi gửi
        input.value = '';
      }
    }

    // Bấm ENTER để gửi
    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });

    // Nhận tin nhắn
    socket.on('chat message', function(msg) {
      const item = document.createElement('li');
      item.textContent = msg.text;   // <-- phải lấy đúng text
      messages.appendChild(item);
      if (!msg.self) {
        audioReceive.play(); // chỉ phát tiếng khi nhận tin nhắn từ người khác
      }
    });
  </script>
</body>
</html>
